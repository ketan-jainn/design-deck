name: designdeck

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: designdeck
      POSTGRES_USER: designdeck
      POSTGRES_PASSWORD: designdeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designdeck -d designdeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
