services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rapidsd
      POSTGRES_USER: rapidsd
      POSTGRES_PASSWORD: rapidsd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidsd -d rapidsd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
