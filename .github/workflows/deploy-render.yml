name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'

permissions: {}

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID" || { echo "Set the RENDER_API_KEY and RENDER_SERVICE_ID repository secrets."; exit 1; }
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"commitId\":\"${COMMIT_SHA}\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" > /dev/null
          echo "Render accepted the deployment request. Check Render for build and deployment status."
