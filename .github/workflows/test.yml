name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/api/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file apps/api/pom.xml
      env:
        REDIS_URL: redis://localhost:6379
        BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
        BAZAARLINK_MODEL: qwen/qwen3.7-flash:free
