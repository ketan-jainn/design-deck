server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rapidsd}
    username: ${DATABASE_USERNAME:rapidsd}
    password: ${DATABASE_PASSWORD:rapidsd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

designdeck:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  gemini-api-key: ${GEMINI_API_KEY:'YOUR_GEMINI_API_KEY'}
  gemini-model: ${GEMINI_MODEL:gemini-flash-latest}
  resend-api-key: ${RESEND_API_KEY:}
  mail:
    from: ${MAIL_FROM:}
