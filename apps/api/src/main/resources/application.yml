server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Design Deck API
    description: System design practice platform

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/designdeck}
    username: ${DATABASE_USERNAME:designdeck}
    password: ${DATABASE_PASSWORD:designdeck}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

designdeck:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  bazaarlink-api-key: ${BAZAARLINK_API_KEY:}
  bazaarlink-model: ${BAZAARLINK_MODEL:qwen/qwen3.7-flash:free}
  resend-api-key: ${RESEND_API_KEY:}
  mail:
    from: ${MAIL_FROM:}
