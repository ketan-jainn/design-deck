server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rapidsd}
    username: ${DATABASE_USERNAME:rapidsd}
    password: ${DATABASE_PASSWORD:rapidsd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

designdeck:
  jwt-secret: ${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
