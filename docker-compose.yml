services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rapidsd
      POSTGRES_USER: rapidsd
      POSTGRES_PASSWORD: rapidsd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidsd -d rapidsd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/rapidsd
      DATABASE_USERNAME: rapidsd
      DATABASE_PASSWORD: rapidsd
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6LUgWzT0Few_-7sc5WNvZw41iG5g4MOFQTQpv9m8uvlaA}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
